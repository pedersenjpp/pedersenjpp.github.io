<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Køkkenmodel</title>
<style>
:root{--bg:#f2f1ee;--surface:#fbfaf8;--ink:#201f1d;--muted:#69645e;--line:#dad5cf;--blue:#2843a4;--err:#a3302a;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#171615;--surface:#201e1c;--ink:#ebe9e5;--muted:#a39c95;--line:#38342f;--blue:#9eadff;--err:#ff8f86;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);padding:24px 16px}
main{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
h1{margin:0 0 6px;font-size:22px}
p{margin:0 0 16px;color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{margin-top:12px;width:100%;font:600 16px/1 var(--sans);padding:13px;border:0;border-radius:8px;background:var(--blue);color:var(--surface);cursor:pointer}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.err{color:var(--err);margin:12px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Køkkenmodel</h1>
  <p>Skriv adgangskoden for at se 3D-modellen af køkkenet.</p>
  <form id="f">
    <label for="pw">Adgangskode</label>
    <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
    <button id="go" type="submit">Åbn</button>
    <p class="err" id="err" role="alert" hidden></p>
  </form>
</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const err = document.getElementById('err'), btn = document.getElementById('go');
function show(msg){ err.textContent = msg; err.hidden = false; }
if (!window.crypto || !crypto.subtle) show('Siden skal åbnes via et https-link i en nyere browser.');
async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(DATA.iv) }, key, b64(DATA.ct));
  return new TextDecoder().decode(buf);
}
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  err.hidden = true; btn.disabled = true; btn.textContent = 'Åbner…';
  let html;
  try { html = await unlock(document.getElementById('pw').value.trim().toLowerCase()); }
  catch (x) { btn.disabled = false; btn.textContent = 'Åbn'; show('Forkert adgangskode. Prøv igen.'); return; }
  document.open(); document.write(html); document.close();
});
</script>
